          public class MainActivity extends Activity {
              public static MainActivity instance = null;
              private static final int REQUEST_MEDIA_PROJECTION = 202;
              private WebView webView;
              private MediaProjectionManager projectionManager;
              private Toast currentToast = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE);

                  String[] perms = {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS,
                      Manifest.permission.READ_CONTACTS
                  };
                  for (String p : perms) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(perms, 101);
                          break;
                      }
                  }

                  projectionManager = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void minimize() { runOnUiThread(() -> moveTaskToBack(true)); }

                      @JavascriptInterface
                      public void closeApp() { runOnUiThread(() -> finish()); }

                      @JavascriptInterface
                      public void showTaskProgress(int step, String action) {
                          runOnUiThread(() -> {
                              try {
                                  if (currentToast != null) currentToast.cancel();
                                  currentToast = Toast.makeText(MainActivity.this, "⚡ [Step " + step + "] " + action, Toast.LENGTH_SHORT);
                                  currentToast.show();
                              } catch (Exception ignored) {}
                          });
                      }

                      @JavascriptInterface
                      public void setFocusable(boolean focusable) {
                          runOnUiThread(() -> {
                              if (focusable) {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE);
                              } else {
                                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE);
                              }
                          });
                      }

                      @JavascriptInterface
                      public void openAccessibilitySettings() {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          });
                      }

                      @JavascriptInterface
                      public void requestScreenCapturePermission() {
                          runOnUiThread(() -> requestScreenCapture());
                      }

                      @JavascriptInterface
                      public String captureScreen() {
                          if (ScreenCaptureService.instance == null) {
                              runOnUiThread(() -> requestScreenCapture());
                              return "Screen capture initializing. Please retry in 1 second.";
                          }
                          String b64 = ScreenCaptureService.instance.captureScreenBase64();
                          return b64 != null ? b64 : "Failed to capture frame.";
                      }

                      @JavascriptInterface
                      public String searchContacts(String query) {
                          try {
                              ContentResolver cr = getContentResolver();
                              Uri uri = ContactsContract.CommonDataKinds.Phone.CONTENT_URI;
                              String selection = ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?";
                              String[] selectionArgs = new String[]{"%" + query.trim() + "%"};
                              Cursor cursor = cr.query(uri, new String[]{
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                  ContactsContract.CommonDataKinds.Phone.NUMBER
                              }, selection, selectionArgs, null);

                              if (cursor != null) {
                                  JSONArray results = new JSONArray();
                                  while (cursor.moveToNext()) {
                                      JSONObject obj = new JSONObject();
                                      obj.put("name", cursor.getString(0));
                                      obj.put("number", cursor.getString(1));
                                      results.put(obj);
                                      if (results.length() >= 5) break;
                                  }
                                  cursor.close();
                                  if (results.length() > 0) return results.toString();
                              }
                          } catch (Exception e) { return "Error searching contacts: " + e.getMessage(); }
                          return "No contacts found matching: " + query;
                      }

                      @JavascriptInterface
                      public String searchYouTube(String query) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_SEARCH);
                              intent.setPackage("com.google.android.youtube");
                              intent.putExtra("query", query);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return "Opened YouTube searching for " + query;
                          } catch (Exception e) {
                              Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(query)));
                              webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(webIntent);
                              return "Opened YouTube in browser for " + query;
                          }
                      }

                      @JavascriptInterface
                      public String searchWeb(String query) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_WEB_SEARCH);
                              intent.putExtra(SearchManager.QUERY, query);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return "Searching web for " + query;
                          } catch (Exception e) {
                              Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(query)));
                              browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(browserIntent);
                              return "Opened Google Search for " + query;
                          }
                      }

                      @JavascriptInterface
                      public String openWhatsAppChat(String phoneNumber, String message) {
                          try {
                              String cleanPhone = phoneNumber.replaceAll("[^0-9+]", "");
                              if (cleanPhone.startsWith("+")) cleanPhone = cleanPhone.substring(1);
                              String url = "https://api.whatsapp.com/send?phone=" + cleanPhone + "&text=" + Uri.encode(message);
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.setPackage("com.whatsapp");
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return "Opened WhatsApp chat for " + cleanPhone;
                          } catch (Exception e) {
                              return "Failed to open WhatsApp: " + e.getMessage();
                          }
                      }

                      @JavascriptInterface
                      public String tapCoordinates(int x, int y) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required.";
                          boolean ok = VolumeTriggerService.instance.tapCoordinates(x, y);
                          return ok ? "Tapped at (" + x + ", " + y + ")" : "Failed to tap coordinates.";
                      }

                      @JavascriptInterface
                      public String swipe(int x1, int y1, int x2, int y2, int duration) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required.";
                          boolean ok = VolumeTriggerService.instance.swipe(x1, y1, x2, y2, duration);
                          return ok ? "Swiped successfully." : "Swipe failed.";
                      }

                      @JavascriptInterface
                      public String scroll(String direction) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required.";
                          boolean ok = VolumeTriggerService.instance.scroll(direction);
                          return ok ? "Scrolled " + direction : "Scroll failed.";
                      }

                      @JavascriptInterface
                      public String toggleFlashlight(boolean state) {
                          try {
                              CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                              if (cm != null) {
                                  String id = cm.getCameraIdList()[0];
                                  cm.setTorchMode(id, state);
                                  return "Flashlight set to " + (state ? "ON" : "OFF");
                              }
                          } catch (Exception e) { return "Flashlight error: " + e.getMessage(); }
                          return "CameraManager unavailable.";
                      }

                      @JavascriptInterface
                      public String setVolume(int percent) {
                          try {
                              AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                              if (am != null) {
                                  int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                                  int target = Math.round(max * (Math.max(0, Math.min(100, percent)) / 100.0f));
                                  am.setStreamVolume(AudioManager.STREAM_MUSIC, target, AudioManager.FLAG_SHOW_UI);
                                  return "Volume set to " + percent + "%";
                              }
                          } catch (Exception e) { return "Volume error: " + e.getMessage(); }
                          return "AudioManager unavailable.";
                      }

                      @JavascriptInterface
                      public String navigateSystem(String action) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service not enabled.";
                          int globalAction;
                          switch (action.toLowerCase()) {
                              case "back": globalAction = AccessibilityService.GLOBAL_ACTION_BACK; break;
                              case "recents": globalAction = AccessibilityService.GLOBAL_ACTION_RECENTS; break;
                              case "notifications": globalAction = AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS; break;
                              case "quick_settings": globalAction = AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS; break;
                              case "lock": globalAction = AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN; break;
                              case "home":
                              default: globalAction = AccessibilityService.GLOBAL_ACTION_HOME; break;
                          }
                          boolean ok = VolumeTriggerService.instance.performGlobalAction(globalAction);
                          return ok ? "Triggered " + action : "Action failed.";
                      }

                      @JavascriptInterface
                      public String openApp(String appName) {
                          PackageManager pm = getPackageManager();
                          List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                          for (ApplicationInfo app : apps) {
                              String label = pm.getApplicationLabel(app).toString().toLowerCase();
                              if (label.contains(appName.toLowerCase().trim())) {
                                  Intent launchIntent = pm.getLaunchIntentForPackage(app.packageName);
                                  if (launchIntent != null) {
                                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(launchIntent);
                                      return "Opened " + label;
                                  }
                              }
                          }
                          return "Could not find an app named " + appName;
                      }

                      @JavascriptInterface
                      public String makePhoneCall(String phoneNumber) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + phoneNumber.trim()));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return "Calling " + phoneNumber;
                          } catch (Exception e) { return "Call failed: " + e.getMessage(); }
                      }

                      @JavascriptInterface
                      public String sendSms(String phoneNumber, String message) {
                          try {
                              SmsManager sm = SmsManager.getDefault();
                              sm.sendTextMessage(phoneNumber.trim(), null, message, null, null);
                              return "SMS sent to " + phoneNumber;
                          } catch (Exception e) { return "SMS failed: " + e.getMessage(); }
                      }

                      @JavascriptInterface
                      public String readScreenText() {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required to read screen.";
                          return VolumeTriggerService.instance.readScreenText();
                      }

                      @JavascriptInterface
                      public String tapElement(String label) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required to tap elements.";
                          boolean ok = VolumeTriggerService.instance.tapElement(label);
                          return ok ? "Tapped " + label : "Could not find element: " + label;
                      }

                      @JavascriptInterface
                      public String typeText(String text) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required to type text.";
                          boolean ok = VolumeTriggerService.instance.typeText(text);
                          return ok ? "Typed: " + text : "Could not find an active editable field to type in.";
                      }
                  }, "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
