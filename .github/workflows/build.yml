              public String bridgeOpenWhatsApp(String phoneNumber, String message) {
                  try {
                      String cleanPhone = phoneNumber.replaceAll("[^0-9+]", "");
                      if (cleanPhone.startsWith("+")) cleanPhone = cleanPhone.substring(1);
                      String url = "https://api.whatsapp.com/send?phone=" + cleanPhone + "&text=" + Uri.encode(message);
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      intent.setPackage("com.whatsapp");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return "Opened WhatsApp for " + cleanPhone;
                  } catch (Exception e) { return "WhatsApp error: " + e.getMessage(); }
              }

