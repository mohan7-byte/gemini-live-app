<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Voice</title>
  <style>
    :root {
      --pill-bg: rgba(13, 16, 26, 0.96);
      --pill-border: rgba(255, 255, 255, 0.16);
      --sheet-bg: rgba(18, 20, 32, 0.98);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --purple: #c084fc;
      --amber: #fbbf24;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .touch-backdrop {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent;
    }

    .dock-container {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .camera-float {
      pointer-events: auto;
      width: 120px;
      height: 90px;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background: #000;
      margin-bottom: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    .camera-float video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cam-flip-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Calibrated for 288px width screen: Compact layout prevents clipping */
    .capsule {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
      max-width: 95vw;
      position: relative;
    }

    .task-progress-bar {
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .task-progress-inner {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, transparent, #06b6d4, #a855f7, transparent);
      transform: translateX(-100%);
    }

    .state-working .task-progress-bar { opacity: 1; }
    .state-working .task-progress-inner {
      animation: taskShimmer 1.2s infinite linear;
    }

    @keyframes taskShimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .orb-slot {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .orb-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.5;
      transition: all 0.3s ease;
    }

    .orb-core {
      position: relative;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.5);
      transition: all 0.3s ease;
      animation: coreFloat 3s ease-in-out infinite alternate;
    }

    @keyframes coreFloat {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }

    .state-idle .orb-glow { background: rgba(99, 102, 241, 0.35); }
    .state-idle .orb-core { background: radial-gradient(circle at 35% 35%, #a5b4fc 0%, #4338ca 100%); }

    .state-listening .orb-glow {
      background: rgba(168, 85, 247, 0.9);
      opacity: 0.9;
      transform: scale(1.2);
    }
    .state-listening .orb-core {
      background: radial-gradient(circle at 35% 35%, #f3e8ff 0%, #a855f7 100%);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.8), inset 0 1px 4px #fff;
    }

    .state-working .orb-glow {
      background: rgba(6, 182, 212, 0.95);
      opacity: 0.95;
      transform: scale(1.25);
      animation: workingPulse 1s ease-in-out infinite alternate;
    }
    .state-working .orb-core {
      background: radial-gradient(circle at 35% 35%, #cffafe 0%, #06b6d4 50%, #0e7490 100%);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.9), inset 0 1px 4px #fff;
    }

    @keyframes workingPulse {
      0% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .state-speaking .orb-glow {
      background: rgba(251, 191, 36, 0.95);
      opacity: 0.95;
      transform: scale(1.25);
    }
    .state-speaking .orb-core {
      background: radial-gradient(circle at 35% 35%, #fffbeb 0%, #f59e0b 50%, #e11d48 100%);
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.85), inset 0 1px 4px #fff;
    }

    .capsule-text {
      display: flex;
      flex-direction: column;
      min-width: 75px;
      max-width: 120px;
    }

    .capsule-status {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .capsule-sub {
      font-size: 0.68rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .state-working .capsule-sub { color: #67e8f9; font-weight: 500; }

    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.22); }
    .icon-btn.active { background: rgba(168, 85, 247, 0.35); border-color: rgba(168, 85, 247, 0.7); color: #e9d5ff; }

    .btn-end { background: rgba(239, 68, 68, 0.88); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-end:active { background: var(--danger); }

    .btn-start {
      background: linear-gradient(135deg, #4338ca, #2563eb);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0 12px;
      height: 34px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Settings Sheet: Uses display block + transform for guaranteed visibility */
    .sheet {
      display: none;
      pointer-events: auto;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--sheet-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px 24px 0 0;
      padding: 12px 14px 20px 14px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 30;
      max-height: 90vh;
      overflow-y: auto;
      color: var(--text);
    }

    .sheet.open {
      display: block !important;
      transform: translateY(0) !important;
    }

    .sheet-handle { width: 34px; height: 4px; background: rgba(255, 255, 255, 0.25); border-radius: 99px; margin: 0 auto 10px auto; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .sheet-title { font-size: 0.9rem; font-weight: 600; }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 0.68rem; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select, .field textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 10px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      user-select: text;
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .toggle-label { font-size: 0.78rem; font-weight: 500; }
    .toggle-desc { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }

    .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #23293d; border-radius: 24px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 15px; width: 15px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: #7c3aed; }
    input:checked + .slider:before { transform: translateX(17px); }

    .action-card-btn {
      width: 100%;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #e9d5ff;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 10px 0;
      cursor: pointer;
      text-align: left;
    }
    .action-card-btn:active { background: rgba(168, 85, 247, 0.22); }

    .memory-section {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .btn-sm {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.6);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-sm:active { transform: scale(0.95); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="state-idle">

  <div class="touch-backdrop" id="dismissBackdrop" onclick="handleBackdropClick(event)"></div>

  <div class="dock-container">
    <div class="camera-float hidden" id="cameraBox">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <button class="cam-flip-btn" id="flipCameraBtn">⇄</button>
    </div>

    <div class="capsule" id="capsule">
      <div class="orb-slot">
        <div class="orb-glow"></div>
        <div class="orb-core"></div>
      </div>

      <div class="capsule-text">
        <div class="capsule-status" id="capsuleStatus">Voice</div>
        <div class="capsule-sub" id="capsuleSub">Ready</div>
      </div>

      <div class="action-group">
        <button class="btn-start" id="connectBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          Start
        </button>

        <div class="action-group hidden" id="liveControls">
          <button class="icon-btn" id="toggleCameraBtn" title="Camera Vision">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>
          <button class="icon-btn btn-end" id="disconnectBtn" title="End Call">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
          </button>
        </div>

        <button class="icon-btn" id="openSettingsBtn" title="Settings" onclick="openSettings(event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>

      <div class="task-progress-bar">
        <div class="task-progress-inner"></div>
      </div>
    </div>
  </div>

  <!-- Settings Sheet -->
  <div class="sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">Configuration & Rules</div>
      <button class="icon-btn" id="closeSettingsBtn" onclick="closeSettings(event)" style="border:none;">✕</button>
    </div>

    <div class="action-card-btn" id="openAccessibilitySettingsBtn">
      <div>
        <div style="font-weight: 600; font-size: 0.8rem;">⚡ Double-Click Volume Setup</div>
        <div style="font-size: 0.68rem; opacity: 0.8; margin-top: 2px;">Turn on Voice trigger in Accessibility</div>
      </div>
      <span style="font-size: 1rem;">➔</span>
    </div>

    <div class="memory-section">
      <div style="font-weight: 600; font-size: 0.78rem; margin-bottom: 4px;">🧠 App Playbooks (288x592 Calibrated)</div>
      <textarea id="rulesEditor" rows="6" style="font-family: monospace; font-size: 0.7rem; white-space: pre;"></textarea>
      <div style="display: flex; gap: 6px; margin-top: 6px;">
        <button class="btn-sm" id="saveRulesBtn">💾 Save</button>
        <button class="btn-sm btn-secondary" id="openFileManagerBtn">📁 My Files</button>
      </div>
    </div>

    <div class="field">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Auto-Connect on Launch</div>
        <div class="toggle-desc">Listen immediately when triggered</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoConnectToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label for="systemPrompt">Assistant Instructions</label>
      <textarea id="systemPrompt" rows="3" placeholder="Leave empty for Jarvis default..."></textarea>
    </div>

    <div class="field">
      <label for="modelSelect">Target Model</label>
      <select id="modelSelect">
        <option value="models/gemini-3.1-flash-live-preview" selected>gemini-3.1-flash-live-preview</option>
      </select>
    </div>

    <div class="field">
      <label for="voiceSelect">Voice Profile</label>
      <select id="voiceSelect">
        <option value="Puck">Puck (Natural)</option>
        <option value="Aoede">Aoede (Expressive)</option>
        <option value="Charon">Charon (Deep)</option>
        <option value="Fenrir">Fenrir (Calm)</option>
        <option value="Kore">Kore (Smooth)</option>
      </select>
    </div>
  </div>

  <canvas id="offscreenCanvas" class="hidden" width="288" height="592"></canvas>

  <script>
    // Fail-Safe: Defined immediately at top of script to prevent ReferenceErrors
    window.openSettings = function(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      const sheet = document.getElementById("settingsSheet");
      if (sheet) {
        sheet.style.display = "block";
        setTimeout(() => sheet.classList.add("open"), 10);
      }
    };

    window.closeSettings = function(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      const sheet = document.getElementById("settingsSheet");
      if (sheet) {
        sheet.classList.remove("open");
        setTimeout(() => { sheet.style.display = "none"; }, 250);
      }
    };

    window.handleBackdropClick = function(e) {
      const sheet = document.getElementById("settingsSheet");
      if (sheet && (sheet.classList.contains("open") || sheet.style.display === "block")) {
        window.closeSettings(e);
        return;
      }
      if (window.AndroidBridge && window.AndroidBridge.minimize) {
        window.AndroidBridge.minimize();
      }
    };

    const DEFAULT_APP_RULES = {
      "com.samsung.android.app.notes": {
        "app_name": "Samsung Notes",
        "actions": {
          "add_note_button": { "x": 253, "y": 554 }
        },
        "rules": [
          "To create a new note, tap the circular pen button at (253, 554).",
          "If cursor is already blinking, do not tap; paste directly with type_text."
        ]
      },
      "com.google.android.youtube": {
        "app_name": "YouTube",
        "rules": [
          "Use search_youtube for instant 1-shot video queries."
        ]
      },
      "com.whatsapp": {
        "app_name": "WhatsApp",
        "rules": [
          "Use open_whatsapp to jump directly into chat with prefilled message."
        ]
      }
    };

    const JARVIS_DEFAULT_PROMPT = `You are Voice (Jarvis), an ultra-fast autonomous Android agent with physical device control and experiential memory.

AUTONOMOUS PROTOCOL:
1. SPATIAL ACCURACY & CANDIDATE IDS:
   - Call read_screen_text first whenever you need to interact with an app. It returns an "INTERACTIVE ELEMENTS" catalog with exact Candidate IDs [#0, #1, #2]!
   - ALWAYS prefer tap_element_id(element_id) when clicking a catalog button. It achieves 100% exact hardware-level accuracy with 0.0px error!
   - For visual coordinates, call tap_coordinates(x, y) or long_press(x, y).
2. REAL-TIME FACTS & KNOWLEDGE:
   - For current events, live sports, or info beyond cutoff, call search_live_web(query) for fast 200ms grounding.
3. TYPING & NOTES:
   - For quick notes, call create_note(text) for instant zero-failure composition.
   - When writing into open apps, text boxes, or chats, call type_text(text). It automatically pastes at the blinking cursor without jumping lines.
4. HYPER-SPEED INTENTS:
   - Use search_youtube, search_web, open_whatsapp, search_contacts, or open_application directly instead of clicking around home screens.
5. CADENCE:
   - Execute actions silently in sequence until the goal is finished.
   - Speak a single, confident 1-sentence confirmation when finished.`;

    const DEVICE_TOOLS_SCHEMA = [
      {
        functionDeclarations: [
          {
            name: "search_live_web",
            description: "Search the web in real-time for live facts, current news, sports scores, or information beyond your knowledge cutoff.",
            parameters: {
              type: "OBJECT",
              properties: {
                query: { type: "STRING", description: "Search terms or question" }
              },
              required: ["query"]
            }
          },
          {
            name: "tap_element_id",
            description: "Directly tap an on-screen button or input by its candidate ID number from the INTERACTIVE ELEMENTS catalog. 100% exact pinpoint accuracy.",
            parameters: {
              type: "OBJECT",
              properties: {
                element_id: { type: "INTEGER", description: "The candidate ID (e.g. 0, 1, 2) from the catalog" }
              },
              required: ["element_id"]
            }
          },
          {
            name: "tap_coordinates",
            description: "Physically tap screen pixel coordinates (x, y) on the display.",
            parameters: {
              type: "OBJECT",
              properties: {
                x: { type: "INTEGER", description: "X coordinate" },
                y: { type: "INTEGER", description: "Y coordinate" }
              },
              required: ["x", "y"]
            }
          },
          {
            name: "long_press",
            description: "Hold down / long-press on coordinates (x, y) for 700ms to select text, open context menus, or trigger special actions.",
            parameters: {
              type: "OBJECT",
              properties: {
                x: { type: "INTEGER", description: "X coordinate" },
                y: { type: "INTEGER", description: "Y coordinate" }
              },
              required: ["x", "y"]
            }
          },
          {
            name: "create_note",
            description: "Instantly create a note or document with the provided text body via Android intent (zero-failure).",
            parameters: {
              type: "OBJECT",
              properties: {
                text: { type: "STRING", description: "The note content" }
              },
              required: ["text"]
            }
          },
          {
            name: "type_text",
            description: "Insert text directly into the active editable field or open note on screen at the blinking cursor.",
            parameters: {
              type: "OBJECT",
              properties: {
                text: { type: "STRING", description: "The text to insert" }
              },
              required: ["text"]
            }
          },
          {
            name: "read_screen_text",
            description: "Extract visible text AND an INTERACTIVE ELEMENTS catalog with candidate IDs for 100% accurate clicking.",
            parameters: { type: "OBJECT", properties: {} }
          },
          {
            name: "capture_screen",
            description: "Capture screenshot to visually analyze layout or image buttons.",
            parameters: { type: "OBJECT", properties: {} }
          },
          {
            name: "scroll",
            description: "Scroll screen up or down.",
            parameters: {
              type: "OBJECT",
              properties: {
                direction: { type: "STRING", enum: ["down", "up"] }
              },
              required: ["direction"]
            }
          },
          {
            name: "swipe",
            description: "Simulate a physical finger swipe across screen.",
            parameters: {
              type: "OBJECT",
              properties: {
                start_x: { type: "INTEGER" },
                start_y: { type: "INTEGER" },
                end_x: { type: "INTEGER" },
                end_y: { type: "INTEGER" },
                duration_ms: { type: "INTEGER" }
              },
              required: ["start_x", "start_y", "end_x", "end_y"]
            }
          },
          {
            name: "wait_seconds",
            description: "Pause execution for 1 to 4 seconds for screen/app to load.",
            parameters: {
              type: "OBJECT",
              properties: {
                seconds: { type: "NUMBER" }
              },
              required: ["seconds"]
            }
          },
          {
            name: "open_application",
            description: "Launch an app by name (e.g. Notes, WhatsApp, Chrome).",
            parameters: {
              type: "OBJECT",
              properties: {
                app_name: { type: "STRING" }
              },
              required: ["app_name"]
            }
          },
          {
            name: "search_contacts",
            description: "Search contact phone number by name.",
            parameters: {
              type: "OBJECT",
              properties: {
                query: { type: "STRING" }
              },
              required: ["query"]
            }
          },
          {
            name: "search_youtube",
            description: "Open YouTube searching for a video or query.",
            parameters: {
              type: "OBJECT",
              properties: {
                query: { type: "STRING" }
              },
              required: ["query"]
            }
          },
          {
            name: "search_web",
            description: "Open Google Search in browser.",
            parameters: {
              type: "OBJECT",
              properties: {
                query: { type: "STRING" }
              },
              required: ["query"]
            }
          },
          {
            name: "open_whatsapp",
            description: "Open WhatsApp chat with prefilled message.",
            parameters: {
              type: "OBJECT",
              properties: {
                phone_number: { type: "STRING" },
                message: { type: "STRING" }
              },
              required: ["phone_number", "message"]
            }
          },
          {
            name: "make_phone_call",
            description: "Call a phone number.",
            parameters: {
              type: "OBJECT",
              properties: {
                phone_number: { type: "STRING" }
              },
              required: ["phone_number"]
            }
          },
          {
            name: "send_sms",
            description: "Send an SMS text message.",
            parameters: {
              type: "OBJECT",
              properties: {
                phone_number: { type: "STRING" },
                message: { type: "STRING" }
              },
              required: ["phone_number", "message"]
            }
          },
          {
            name: "toggle_flashlight",
            description: "Turn flashlight on or off.",
            parameters: {
              type: "OBJECT",
              properties: {
                state: { type: "BOOLEAN" }
              },
              required: ["state"]
            }
          },
          {
            name: "set_volume",
            description: "Set volume (0 to 100).",
            parameters: {
              type: "OBJECT",
              properties: {
                level_percent: { type: "INTEGER" }
              },
              required: ["level_percent"]
            }
          },
          {
            name: "navigate_system",
            description: "System navigation (home, back, recents, lock, notifications).",
            parameters: {
              type: "OBJECT",
              properties: {
                action: { type: "STRING", enum: ["home", "back", "recents", "notifications", "quick_settings", "lock"] }
              },
              required: ["action"]
            }
          }
        ]
      }
    ];

    let cameraStream = null;
    let cameraInterval = null;
    let isCameraActive = false;
    let currentFacingMode = "environment";
    const cameraBox = document.getElementById("cameraBox");
    const cameraVideo = document.getElementById("cameraVideo");
    const offscreenCanvas = document.getElementById("offscreenCanvas");
    const offscreenCtx = offscreenCanvas.getContext("2d");

    const apiKeyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("modelSelect");
    const voiceSelect = document.getElementById("voiceSelect");
    const systemPromptInput = document.getElementById("systemPrompt");
    const autoConnectToggle = document.getElementById("autoConnectToggle");
    const rulesEditor = document.getElementById("rulesEditor");
    const saveRulesBtn = document.getElementById("saveRulesBtn");
    const openFileManagerBtn = document.getElementById("openFileManagerBtn");

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const toggleCameraBtn = document.getElementById("toggleCameraBtn");
    const flipCameraBtn = document.getElementById("flipCameraBtn");
    const liveControls = document.getElementById("liveControls");

    const capsuleStatus = document.getElementById("capsuleStatus");
    const capsuleSub = document.getElementById("capsuleSub");

    document.getElementById("openAccessibilitySettingsBtn").onclick = () => {
      if (window.AndroidBridge && window.AndroidBridge.openAccessibilitySettings) {
        window.AndroidBridge.openAccessibilitySettings();
      }
    };

    try {
      const savedRules = localStorage.getItem("jarvis_app_rules");
      rulesEditor.value = savedRules ? savedRules : JSON.stringify(DEFAULT_APP_RULES, null, 2);

      if (localStorage.getItem("gemini_live_key")) apiKeyInput.value = localStorage.getItem("gemini_live_key");
      if (localStorage.getItem("gemini_live_voice")) voiceSelect.value = localStorage.getItem("gemini_live_voice");

      if (localStorage.getItem("gemini_live_has_saved_prompt") === "true") {
        systemPromptInput.value = localStorage.getItem("gemini_live_system_prompt") || "";
      } else {
        systemPromptInput.value = JARVIS_DEFAULT_PROMPT;
      }

      if (localStorage.getItem("gemini_live_auto_connect") !== null) {
        autoConnectToggle.checked = localStorage.getItem("gemini_live_auto_connect") === "true";
      }
    } catch(e) {}

    saveRulesBtn.onclick = () => {
      try {
        const parsed = JSON.parse(rulesEditor.value);
        localStorage.setItem("jarvis_app_rules", JSON.stringify(parsed, null, 2));
        if (window.AndroidBridge && window.AndroidBridge.saveRulesToFile) {
          window.AndroidBridge.saveRulesToFile(JSON.stringify(parsed, null, 2));
        }
        alert("Rules saved successfully!");
      } catch(err) {
        alert("Invalid JSON: " + err.message);
      }
    };

    openFileManagerBtn.onclick = () => {
      if (window.AndroidBridge && window.AndroidBridge.openRulesInFileManager) {
        window.AndroidBridge.openRulesInFileManager();
      }
    };

    voiceSelect.onchange = () => localStorage.setItem("gemini_live_voice", voiceSelect.value);
    systemPromptInput.addEventListener("input", () => {
      localStorage.setItem("gemini_live_has_saved_prompt", "true");
      localStorage.setItem("gemini_live_system_prompt", systemPromptInput.value);
    });
    autoConnectToggle.onchange = () => localStorage.setItem("gemini_live_auto_connect", autoConnectToggle.checked);

    window.setVisualState = function(state, status, sub) {
      document.body.className = `state-${state}`;
      capsuleStatus.innerText = status;
      capsuleSub.innerText = sub;

      if (state === "idle") {
        connectBtn.classList.remove("hidden");
        liveControls.classList.add("hidden");
      } else {
        connectBtn.classList.add("hidden");
        liveControls.classList.remove("hidden");
      }
    };

    window.showTaskStep = function(step, description) {
      window.setVisualState("working", `Working • Step ${step}`, description);
    };

    connectBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        window.openSettings();
        return;
      }
      try { localStorage.setItem("gemini_live_key", key); } catch(e) {}

      window.setVisualState("idle", "Connecting...", "Native Engine");

      if (window.AndroidBridge && window.AndroidBridge.startLiveSession) {
        window.AndroidBridge.startLiveSession(
          key,
          modelSelect.value,
          voiceSelect.value,
          systemPromptInput.value,
          JSON.stringify(DEVICE_TOOLS_SCHEMA)
        );
      }
    });

    disconnectBtn.addEventListener("click", () => {
      stopCameraVision();
      if (window.AndroidBridge && window.AndroidBridge.stopLiveSession) {
        window.AndroidBridge.stopLiveSession();
      }
    });

    toggleCameraBtn.addEventListener("click", async () => {
      if (!isCameraActive) {
        await startCameraVision();
      } else {
        stopCameraVision();
      }
    });

    async function startCameraVision() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 288 }, height: { ideal: 592 } },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraBox.classList.remove("hidden");
        toggleCameraBtn.classList.add("active");
        isCameraActive = true;
        startCameraStreaming();
      } catch(e) {
        toggleCameraBtn.classList.remove("active");
      }
    }

    function stopCameraVision() {
      if (cameraInterval) { clearInterval(cameraInterval); cameraInterval = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
      cameraBox.classList.add("hidden");
      toggleCameraBtn.classList.remove("active");
      isCameraActive = false;
    }

    flipCameraBtn.onclick = async () => {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      await startCameraVision();
    };

    function startCameraStreaming() {
      if (cameraInterval) clearInterval(cameraInterval);
      cameraInterval = setInterval(() => {
        if (!cameraStream || !isCameraActive || cameraVideo.readyState < 2 || cameraVideo.videoWidth === 0) return;

        offscreenCtx.drawImage(cameraVideo, 0, 0, 288, 592);
        const dataUrl = offscreenCanvas.toDataURL("image/jpeg", 0.6);
        const parts = dataUrl.split(",");
        if (parts.length < 2) return;

        if (window.AndroidBridge && window.AndroidBridge.sendCameraFrame) {
          window.AndroidBridge.sendCameraFrame(parts[1].trim());
        }
      }, 1000);
    }

    window.autoConnectOnWake = function() {
      if (autoConnectToggle.checked && apiKeyInput.value.trim()) {
        connectBtn.click();
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      if (autoConnectToggle.checked && apiKeyInput.value.trim()) {
        setTimeout(() => connectBtn.click(), 300);
      }
    });
  </script>
</body>
</html>
