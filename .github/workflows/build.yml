                  webView.loadUrl("file:///android_asset/index.html");
              }

              // Native Bridge Methods Called Directly by GeminiLiveClient
              // Fast 200ms real-time search grounding using existing OkHttp
            public String bridgeSearchLiveWeb(String query) {
                try {
                    okhttp3.Request req = new okhttp3.Request.Builder()
                        .url("https://html.duckduckgo.com/html/?q=" + Uri.encode(query))
                        .header("User-Agent", "Mozilla/5.0 (Android 10; Mobile)")
                        .build();

                    okhttp3.Response resp = new okhttp3.OkHttpClient().newCall(req).execute();
                    if (!resp.isSuccessful()) return "Search request failed.";
                    String html = resp.body().string();

                    StringBuilder sb = new StringBuilder();
                    int start = 0;
                    int count = 0;
                    while ((start = html.indexOf("class=\"result__snippet\"", start)) != -1 && count < 3) {
                        int tagClose = html.indexOf(">", start);
                        int end = html.indexOf("</a>", tagClose);
                        if (tagClose != -1 && end != -1) {
                            String snippet = html.substring(tagClose + 1, end).replaceAll("<[^>]*>", "").trim();
                            if (!snippet.isEmpty()) {
                                sb.append("- ").append(snippet).append("\n");
                                count++;
                            }
                        }
                        start += 25;
                    }
                    String res = sb.toString().trim();
                    return res.isEmpty() ? "No instant live results found." : res;
                } catch (Exception e) {
                    return "Search error: " + e.getMessage();
                }
            }
