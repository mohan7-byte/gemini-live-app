              public void setWindowTouchThrough(boolean touchThrough) {
                  runOnUiThread(() -> {
                      if (touchThrough) {
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE);
                      } else {
                          getWindow().clearFlags(WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE);
                      }
                  });
              }

              public void requestScreenCapture() {
                  if (ScreenCaptureService.instance != null) return;
                  if (projectionManager != null) {
                      startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_MEDIA_PROJECTION);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQUEST_MEDIA_PROJECTION && resultCode == Activity.RESULT_OK && data != null) {
                      Intent serviceIntent = new Intent(this, ScreenCaptureService.class);
                      serviceIntent.putExtra("resultCode", resultCode);
                      serviceIntent.putExtra("data", data);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }

                  if (webView != null) {
                      webView.resumeTimers();
                      webView.evaluateJavascript("if (typeof autoConnectOnWake === 'function') autoConnectOnWake();", null);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      moveTaskToBack(true);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
