name: Build Gemini Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Native Android App
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html

          # Fallback icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice</string>
              <string name="accessibility_desc">Enables Volume Down double-click trigger, screen reading, and autonomous device controls.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "Voice"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.live"
                  minSdk 24
                  targetSdk 34
                  versionCode 9
                  versionName "1.8"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # Manifest with Device Control Permissions
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />

              <application
                  android:label="Voice"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleInstance"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeTriggerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # VolumeTriggerService.java: Haptic Feedback + Screen Inspection & Automation
          cat << 'EOF' > app/src/main/java/com/gemini/live/VolumeTriggerService.java
          package com.gemini.live;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          public class VolumeTriggerService extends AccessibilityService {
              public static VolumeTriggerService instance = null;
              private long lastVolumeDownTime = 0;
              private static final long DOUBLE_PRESS_INTERVAL = 450;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  int action = event.getAction();

                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && action == KeyEvent.ACTION_DOWN) {
                      long now = SystemClock.uptimeMillis();
                      if (now - lastVolumeDownTime < DOUBLE_PRESS_INTERVAL) {
                          lastVolumeDownTime = 0;
                          launchAssistantWithHaptics();
                          return true;
                      } else {
                          lastVolumeDownTime = now;
                      }
                  }
                  return super.onKeyEvent(event);
              }

              private void launchAssistantWithHaptics() {
                  // Dual-pulse tactile vibration feedback
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(new long[]{0, 50, 70, 50}, -1));
                          } else {
                              v.vibrate(new long[]{0, 50, 70, 50}, -1);
                          }
                      }
                  } catch (Exception ignored) {}

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK 
                                | Intent.FLAG_ACTIVITY_SINGLE_TOP 
                                | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(intent);
              }

              // Extract text from current active window
              public String readScreenText() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "No active window content detected.";
                  StringBuilder sb = new StringBuilder();
                  extractTextRecursive(root, sb, 0);
                  String result = sb.toString().trim();
                  return result.isEmpty() ? "Screen is empty or text unreadable." : result;
              }

              private void extractTextRecursive(AccessibilityNodeInfo node, StringBuilder sb, int depth) {
                  if (node == null || depth > 25) return;
                  CharSequence text = node.getText();
                  if (text != null && text.length() > 0) {
                      sb.append(text).append("\n");
                  } else {
                      CharSequence desc = node.getContentDescription();
                      if (desc != null && desc.length() > 0) {
                          sb.append(desc).append("\n");
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      extractTextRecursive(node.getChild(i), sb, depth + 1);
                  }
              }

              // Click UI element matching label
              public boolean tapElement(String label) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  return findAndClick(root, label.toLowerCase().trim(), 0);
              }

              private boolean findAndClick(AccessibilityNodeInfo node, String target, int depth) {
                  if (node == null || depth > 25) return false;
                  CharSequence text = node.getText();
                  CharSequence desc = node.getContentDescription();
                  boolean match = (text != null && text.toString().toLowerCase().contains(target)) ||
                                  (desc != null && desc.toString().toLowerCase().contains(target));
                  if (match) {
                      AccessibilityNodeInfo cur = node;
                      while (cur != null) {
                          if (cur.isClickable()) return cur.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          cur = cur.getParent();
                      }
                      return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (findAndClick(node.getChild(i), target, depth + 1)) return true;
                  }
                  return false;
              }

              // Insert text into focused/editable input
              public boolean typeText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo target = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (target == null) target = findFirstEditable(root, 0);
                  if (target != null) {
                      Bundle args = new Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      return target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                  }
                  return false;
              }

              private AccessibilityNodeInfo findFirstEditable(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 25) return null;
                  if (node.isEditable()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo found = findFirstEditable(node.getChild(i), depth + 1);
                      if (found != null) return found;
                  }
                  return null;
              }
          }
          EOF

          # MainActivity.java: Native Device Control Bridge
          cat << 'EOF' > app/src/main/java/com/gemini/live/MainActivity.java
          package com.gemini.live;

          import android.Manifest;
          import android.accessibilityservice.AccessibilityService;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.telephony.SmsManager;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean isFlashlightOn = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));

                  // Request permissions for device controls
                  String[] perms = {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS
                  };
                  for (String p : perms) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(perms, 101);
                          break;
                      }
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  // Autonomous Device Control Bridge
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void minimize() { runOnUiThread(() -> moveTaskToBack(true)); }

                      @JavascriptInterface
                      public void closeApp() { runOnUiThread(() -> finish()); }

                      @JavascriptInterface
                      public void openAccessibilitySettings() {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          });
                      }

                      @JavascriptInterface
                      public String toggleFlashlight(boolean state) {
                          try {
                              CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                              if (cm != null) {
                                  String id = cm.getCameraIdList()[0];
                                  cm.setTorchMode(id, state);
                                  isFlashlightOn = state;
                                  return "Flashlight set to " + (state ? "ON" : "OFF");
                              }
                          } catch (Exception e) { return "Flashlight error: " + e.getMessage(); }
                          return "CameraManager unavailable.";
                      }

                      @JavascriptInterface
                      public String setVolume(int percent) {
                          try {
                              AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                              if (am != null) {
                                  int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                                  int target = Math.round(max * (Math.max(0, Math.min(100, percent)) / 100.0f));
                                  am.setStreamVolume(AudioManager.STREAM_MUSIC, target, AudioManager.FLAG_SHOW_UI);
                                  return "Volume set to " + percent + "%";
                              }
                          } catch (Exception e) { return "Volume error: " + e.getMessage(); }
                          return "AudioManager unavailable.";
                      }

                      @JavascriptInterface
                      public String navigateSystem(String action) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service not enabled.";
                          int globalAction;
                          switch (action.toLowerCase()) {
                              case "back": globalAction = AccessibilityService.GLOBAL_ACTION_BACK; break;
                              case "notifications": globalAction = AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS; break;
                              case "quick_settings": globalAction = AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS; break;
                              case "lock": globalAction = AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN; break;
                              case "home":
                              default: globalAction = AccessibilityService.GLOBAL_ACTION_HOME; break;
                          }
                          boolean ok = VolumeTriggerService.instance.performGlobalAction(globalAction);
                          return ok ? "Triggered " + action : "Action failed.";
                      }

                      @JavascriptInterface
                      public String openApp(String appName) {
                          PackageManager pm = getPackageManager();
                          List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                          for (ApplicationInfo app : apps) {
                              String label = pm.getApplicationLabel(app).toString().toLowerCase();
                              if (label.contains(appName.toLowerCase().trim())) {
                                  Intent launchIntent = pm.getLaunchIntentForPackage(app.packageName);
                                  if (launchIntent != null) {
                                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(launchIntent);
                                      return "Opened " + label;
                                  }
                              }
                          }
                          return "Could not find an app named " + appName;
                      }

                      @JavascriptInterface
                      public String makePhoneCall(String phoneNumber) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + phoneNumber.trim()));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return "Calling " + phoneNumber;
                          } catch (Exception e) { return "Call failed: " + e.getMessage(); }
                      }

                      @JavascriptInterface
                      public String sendSms(String phoneNumber, String message) {
                          try {
                              SmsManager sm = SmsManager.getDefault();
                              sm.sendTextMessage(phoneNumber.trim(), null, message, null, null);
                              return "SMS sent to " + phoneNumber;
                          } catch (Exception e) { return "SMS failed: " + e.getMessage(); }
                      }

                      @JavascriptInterface
                      public String readScreenText() {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required to read screen.";
                          return VolumeTriggerService.instance.readScreenText();
                      }

                      @JavascriptInterface
                      public String tapElement(String label) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required to tap elements.";
                          boolean ok = VolumeTriggerService.instance.tapElement(label);
                          return ok ? "Tapped " + label : "Could not find element: " + label;
                      }

                      @JavascriptInterface
                      public String typeText(String text) {
                          if (VolumeTriggerService.instance == null) return "Accessibility Service required to type text.";
                          boolean ok = VolumeTriggerService.instance.typeText(text);
                          return ok ? "Typed text." : "No editable field currently active.";
                      }
                  }, "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }

                  if (webView != null) {
                      webView.resumeTimers();
                      webView.evaluateJavascript("if (typeof autoConnectOnWake === 'function') autoConnectOnWake();", null);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      moveTaskToBack(true);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Direct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.8 --yes || true
          git tag -d v1.8 || true
          gh release create v1.8 app/build/outputs/apk/debug/app-debug.apk \
            --title "Voice v1.8" \
            --notes "Voice Assistant v1.8 - Autonomous Device Control, Screen Reading/Tapping, Haptics & Calling" || true
