              public String bridgeToggleFlashlight(boolean state) {
                  try {
                      CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                      if (cm != null) {
                          String id = cm.getCameraIdList()[0];
                          cm.setTorchMode(id, state);
                          return "Flashlight set to " + (state ? "ON" : "OFF");
                      }
                  } catch (Exception e) { return "Flashlight error: " + e.getMessage(); }
                  return "CameraManager unavailable.";
              }

              public String bridgeSetVolume(int percent) {
                  try {
                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                          int target = Math.round(max * (Math.max(0, Math.min(100, percent)) / 100.0f));
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, target, AudioManager.FLAG_SHOW_UI);
                          return "Volume set to " + percent + "%";
                      }
                  } catch (Exception e) { return "Volume error: " + e.getMessage(); }
                  return "AudioManager unavailable.";
              }

              public String bridgeNavigateSystem(String action) {
                  if (VolumeTriggerService.instance == null) return "Accessibility Service required.";
                  int globalAction;
                  switch (action.toLowerCase()) {
                      case "back": globalAction = AccessibilityService.GLOBAL_ACTION_BACK; break;
                      case "recents": globalAction = AccessibilityService.GLOBAL_ACTION_RECENTS; break;
                      case "notifications": globalAction = AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS; break;
                      case "quick_settings": globalAction = AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS; break;
                      case "lock": globalAction = AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN; break;
                      case "home":
                      default: globalAction = AccessibilityService.GLOBAL_ACTION_HOME; break;
                  }
                  boolean ok = VolumeTriggerService.instance.performGlobalAction(globalAction);
                  return ok ? "Triggered " + action : "Action failed.";
              }

              public void requestScreenCapture() {
                  if (ScreenCaptureService.instance != null) return;
                  if (projectionManager != null) {
                      startActivityForResult(projectionManager.createScreenCaptureIntent(), REQUEST_MEDIA_PROJECTION);
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQUEST_MEDIA_PROJECTION && resultCode == Activity.RESULT_OK && data != null) {
                      Intent serviceIntent = new Intent(this, ScreenCaptureService.class);
                      serviceIntent.putExtra("resultCode", resultCode);
                      serviceIntent.putExtra("data", data);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onDestroy() {
                  instance = null;
                  if (liveClient != null) liveClient.disconnect();
                  super.onDestroy();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }

                  if (webView != null) {
                      webView.resumeTimers();
                      webView.evaluateJavascript("if (typeof autoConnectOnWake === 'function') autoConnectOnWake();", null);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      moveTaskToBack(true);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
