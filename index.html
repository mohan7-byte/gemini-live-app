<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Voice</title>
  <style>
    :root {
      --pill-bg: rgba(13, 16, 26, 0.94);
      --pill-border: rgba(255, 255, 255, 0.14);
      --sheet-bg: rgba(18, 20, 32, 0.98);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --purple: #c084fc;
      --amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    html, body {
      background: transparent !important;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .touch-backdrop {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent;
    }

    .dock-container {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .camera-float {
      pointer-events: auto;
      width: 140px;
      height: 105px;
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background: #000;
      margin-bottom: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
      position: relative;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.8) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .camera-float video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cam-flip-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .capsule {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px 8px 10px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 92vw;
    }

    .orb-slot {
      position: relative;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .orb-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.5;
      transition: all 0.5s ease;
    }

    .orb-core {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      box-shadow: inset 0 2px 6px rgba(255,255,255,0.5);
      transition: all 0.4s ease;
      animation: coreFloat 3.5s ease-in-out infinite alternate;
    }

    @keyframes coreFloat {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.04); }
    }

    .state-idle .orb-glow { background: rgba(99, 102, 241, 0.35); }
    .state-idle .orb-core { background: radial-gradient(circle at 35% 35%, #a5b4fc 0%, #4338ca 100%); }

    .state-listening .orb-glow {
      background: rgba(168, 85, 247, 0.9);
      opacity: 0.9;
      transform: scale(1.25);
    }
    .state-listening .orb-core {
      background: radial-gradient(circle at 35% 35%, #f3e8ff 0%, #a855f7 100%);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.8), inset 0 2px 6px #fff;
    }

    .state-speaking .orb-glow {
      background: rgba(251, 191, 36, 0.95);
      opacity: 0.95;
      transform: scale(1.35);
    }
    .state-speaking .orb-core {
      background: radial-gradient(circle at 35% 35%, #fffbeb 0%, #f59e0b 50%, #e11d48 100%);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.85), inset 0 2px 6px #fff;
    }

    .capsule-text {
      display: flex;
      flex-direction: column;
      min-width: 80px;
    }

    .capsule-status {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .capsule-sub {
      font-size: 0.68rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.18); }
    .icon-btn.active { background: rgba(168, 85, 247, 0.35); border-color: rgba(168, 85, 247, 0.7); color: #e9d5ff; }
    .icon-btn.muted { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }

    .btn-end { background: rgba(239, 68, 68, 0.88); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-end:active { background: var(--danger); }

    .btn-start {
      background: linear-gradient(135deg, #4338ca, #2563eb);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0 16px;
      height: 36px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .sheet {
      pointer-events: auto;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--sheet-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px 28px 0 0;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      padding: 16px 22px calc(env(safe-area-inset-bottom, 16px) + 18px) 22px;
      transform: translateY(102%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
      max-height: 82vh;
      overflow-y: auto;
      color: var(--text);
    }

    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 38px; height: 4px; background: rgba(255, 255, 255, 0.25); border-radius: 99px; margin: 0 auto 14px auto; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-title { font-size: 0.95rem; font-weight: 600; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select, .field textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .toggle-label { font-size: 0.82rem; font-weight: 500; }
    .toggle-desc { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

    .switch { position: relative; display: inline-block; width: 42px; height: 23px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #23293d; border-radius: 24px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 17px; width: 17px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background-color: #7c3aed; }
    input:checked + .slider:before { transform: translateX(19px); }

    .action-card-btn {
      width: 100%;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #e9d5ff;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 14px 0;
      cursor: pointer;
      text-align: left;
    }
    .action-card-btn:active { background: rgba(168, 85, 247, 0.22); }

    .hidden { display: none !important; }
  </style>
</head>
<body class="state-idle">

  <div class="touch-backdrop" id="dismissBackdrop"></div>

  <div class="dock-container">
    <div class="camera-float hidden" id="cameraBox">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <button class="cam-flip-btn" id="flipCameraBtn">⇄</button>
    </div>

    <div class="capsule" id="capsule">
      <div class="orb-slot">
        <div class="orb-glow"></div>
        <div class="orb-core"></div>
      </div>

      <div class="capsule-text">
        <div class="capsule-status" id="capsuleStatus">Voice</div>
        <div class="capsule-sub" id="capsuleSub">Ready</div>
      </div>

      <div class="action-group">
        <button class="btn-start" id="connectBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          Start
        </button>

        <div class="action-group hidden" id="liveControls">
          <button class="icon-btn" id="toggleCameraBtn" title="Camera Vision">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>
          <button class="icon-btn" id="muteBtn" title="Mute Mic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          <button class="icon-btn btn-end" id="disconnectBtn" title="End Call">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
          </button>
        </div>

        <button class="icon-btn" id="openSettingsBtn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Sheet -->
  <div class="sheet" id="settingsSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">Configuration</div>
      <button class="icon-btn" id="closeSettingsBtn" style="border:none;">✕</button>
    </div>

    <div class="action-card-btn" id="openAccessibilitySettingsBtn">
      <div>
        <div style="font-weight: 600; font-size: 0.85rem;">⚡ Double-Click Volume Setup</div>
        <div style="font-size: 0.72rem; opacity: 0.8; margin-top: 2px;">Tap to open Accessibility & turn on Voice trigger</div>
      </div>
      <span style="font-size: 1.2rem;">➔</span>
    </div>

    <div class="field">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." />
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Auto-Connect on Launch</div>
        <div class="toggle-desc">Listen immediately when triggered</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoConnectToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Speaker Echo Guard</div>
        <div class="toggle-desc">Prevents speaker acoustic feedback loop</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="echoGuardToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Bluetooth Priority Mode</div>
        <div class="toggle-desc">Keep audio on media speaker</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="btPriorityToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="field" style="margin-top: 14px;">
      <label for="systemPrompt">Assistant Instructions</label>
      <textarea id="systemPrompt" rows="2" placeholder="Leave empty for raw default..."></textarea>
    </div>

    <div class="field">
      <label for="modelSelect">Target Model</label>
      <select id="modelSelect">
        <option value="models/gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
        <option value="models/gemini-2.5-flash-native-audio-preview-12-2025">gemini-2.5-flash-native-audio-preview</option>
        <option value="models/gemini-2.0-flash-exp">gemini-2.0-flash-exp</option>
      </select>
    </div>

    <div class="field">
      <label for="voiceSelect">Voice Profile</label>
      <select id="voiceSelect">
        <option value="Aoede">Aoede (Expressive)</option>
        <option value="Puck">Puck (Natural)</option>
        <option value="Charon">Charon (Deep)</option>
        <option value="Fenrir">Fenrir (Calm)</option>
        <option value="Kore">Kore (Smooth)</option>
      </select>
    </div>
  </div>

  <canvas id="offscreenCanvas" class="hidden" width="320" height="240"></canvas>

  <script>
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micProcessor = null;
    let isMuted = false;
    let nextAudioTime = 0;
    let activeSources = [];

    let cameraStream = null;
    let cameraInterval = null;
    let isCameraActive = false;
    let currentFacingMode = "environment";
    const cameraBox = document.getElementById("cameraBox");
    const cameraVideo = document.getElementById("cameraVideo");
    const offscreenCanvas = document.getElementById("offscreenCanvas");
    const offscreenCtx = offscreenCanvas.getContext("2d");

    let isModelSpeaking = false;
    let echoCooldownTimer = null;

    const apiKeyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("modelSelect");
    const voiceSelect = document.getElementById("voiceSelect");
    const systemPromptInput = document.getElementById("systemPrompt");
    const autoConnectToggle = document.getElementById("autoConnectToggle");
    const echoGuardToggle = document.getElementById("echoGuardToggle");
    const btPriorityToggle = document.getElementById("btPriorityToggle");

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const muteBtn = document.getElementById("muteBtn");
    const toggleCameraBtn = document.getElementById("toggleCameraBtn");
    const flipCameraBtn = document.getElementById("flipCameraBtn");
    const liveControls = document.getElementById("liveControls");
    const dismissBackdrop = document.getElementById("dismissBackdrop");

    const capsuleStatus = document.getElementById("capsuleStatus");
    const capsuleSub = document.getElementById("capsuleSub");
    const settingsSheet = document.getElementById("settingsSheet");

    document.getElementById("openSettingsBtn").onclick = () => settingsSheet.classList.toggle("open");
    document.getElementById("closeSettingsBtn").onclick = () => settingsSheet.classList.remove("open");

    document.getElementById("openAccessibilitySettingsBtn").onclick = () => {
      if (window.AndroidBridge && window.AndroidBridge.openAccessibilitySettings) {
        window.AndroidBridge.openAccessibilitySettings();
      }
    };

    dismissBackdrop.onclick = () => {
      if (settingsSheet.classList.contains("open")) {
        settingsSheet.classList.remove("open");
        return;
      }
      if (window.AndroidBridge && window.AndroidBridge.minimize) {
        window.AndroidBridge.minimize();
      }
    };

    try {
      if (localStorage.getItem("gemini_live_key")) apiKeyInput.value = localStorage.getItem("gemini_live_key");
      if (localStorage.getItem("gemini_live_voice")) voiceSelect.value = localStorage.getItem("gemini_live_voice");
      if (localStorage.getItem("gemini_live_model")) modelSelect.value = localStorage.getItem("gemini_live_model");

      if (localStorage.getItem("gemini_live_has_saved_prompt") === "true") {
        systemPromptInput.value = localStorage.getItem("gemini_live_system_prompt") || "";
      } else {
        systemPromptInput.value = "You are a lightning-fast personal AI assistant with full Android device control. Keep responses direct, natural, and 1 to 2 sentences. Use your tools whenever asked to perform device actions, make calls, read the screen, or tap items.";
      }

      if (localStorage.getItem("gemini_live_auto_connect") !== null) autoConnectToggle.checked = localStorage.getItem("gemini_live_auto_connect") === "true";
      if (localStorage.getItem("gemini_live_echo_guard") !== null) echoGuardToggle.checked = localStorage.getItem("gemini_live_echo_guard") === "true";
      if (localStorage.getItem("gemini_live_bt_priority") !== null) btPriorityToggle.checked = localStorage.getItem("gemini_live_bt_priority") === "true";
    } catch(e) {}

    voiceSelect.onchange = () => localStorage.setItem("gemini_live_voice", voiceSelect.value);
    modelSelect.onchange = () => localStorage.setItem("gemini_live_model", modelSelect.value);
    systemPromptInput.addEventListener("input", () => {
      localStorage.setItem("gemini_live_has_saved_prompt", "true");
      localStorage.setItem("gemini_live_system_prompt", systemPromptInput.value);
    });
    autoConnectToggle.onchange = () => localStorage.setItem("gemini_live_auto_connect", autoConnectToggle.checked);
    echoGuardToggle.onchange = () => localStorage.setItem("gemini_live_echo_guard", echoGuardToggle.checked);
    btPriorityToggle.onchange = () => localStorage.setItem("gemini_live_bt_priority", btPriorityToggle.checked);

    function setVisualState(state, status, sub) {
      document.body.className = `state-${state}`;
      capsuleStatus.innerText = status;
      capsuleSub.innerText = sub;
    }

    // Full Autonomous Tool Declarations for Live API
    const deviceTools = [
      {
        functionDeclarations: [
          {
            name: "toggle_flashlight",
            description: "Turn the phone flashlight / torch on or off",
            parameters: {
              type: "OBJECT",
              properties: {
                state: { type: "BOOLEAN", description: "true for ON, false for OFF" }
              },
              required: ["state"]
            }
          },
          {
            name: "set_volume",
            description: "Set the device media volume percentage (0 to 100)",
            parameters: {
              type: "OBJECT",
              properties: {
                level_percent: { type: "INTEGER", description: "Volume level from 0 to 100" }
              },
              required: ["level_percent"]
            }
          },
          {
            name: "navigate_system",
            description: "Execute global Android navigation actions",
            parameters: {
              type: "OBJECT",
              properties: {
                action: { 
                  type: "STRING", 
                  enum: ["home", "back", "notifications", "quick_settings", "lock"],
                  description: "Navigation action to trigger"
                }
              },
              required: ["action"]
            }
          },
          {
            name: "open_application",
            description: "Launch an installed Android application by name (e.g., WhatsApp, YouTube, Maps)",
            parameters: {
              type: "OBJECT",
              properties: {
                app_name: { type: "STRING", description: "Name of the app to launch" }
              },
              required: ["app_name"]
            }
          },
          {
            name: "make_phone_call",
            description: "Directly dial or call a phone number",
            parameters: {
              type: "OBJECT",
              properties: {
                phone_number: { type: "STRING", description: "Phone number digits to call" }
              },
              required: ["phone_number"]
            }
          },
          {
            name: "send_sms",
            description: "Send an SMS text message directly to a phone number",
            parameters: {
              type: "OBJECT",
              properties: {
                phone_number: { type: "STRING", description: "Recipient phone number" },
                message: { type: "STRING", description: "Text message body" }
              },
              required: ["phone_number", "message"]
            }
          },
          {
            name: "read_screen_text",
            description: "Extract and read all text currently visible on the user's active screen (reads contacts, messages, web pages, error dialogs)",
            parameters: { type: "OBJECT", properties: {} }
          },
          {
            name: "tap_element",
            description: "Tap or click a button, contact, or UI element matching a label on screen (e.g. 'Share', 'Send', a contact name)",
            parameters: {
              type: "OBJECT",
              properties: {
                label: { type: "STRING", description: "Text or description of the button/item to tap" }
              },
              required: ["label"]
            }
          },
          {
            name: "type_text",
            description: "Directly type text into the currently active or focused input field on screen",
            parameters: {
              type: "OBJECT",
              properties: {
                text: { type: "STRING", description: "The text to insert" }
              },
              required: ["text"]
            }
          }
        ]
      }
    ];

    // Connect & Start Voice Session
    connectBtn.addEventListener("click", async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        settingsSheet.classList.add("open");
        return;
      }
      try { localStorage.setItem("gemini_live_key", key); } catch(e) {}

      setVisualState("idle", "Connecting...", "Initializing");

      const useBtPriority = btPriorityToggle.checked;
      const audioConstraints = useBtPriority
        ? { channelCount: 1, sampleRate: 16000, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        : { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true };

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
      } catch (err) {
        setVisualState("idle", "Mic Blocked", "Access Denied");
        return;
      }

      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtxClass({ sampleRate: 24000 });
      if (audioCtx.state === "suspended") await audioCtx.resume();

      const chosenModel = modelSelect.value.trim();
      const endpoint = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`;

      try {
        ws = new WebSocket(endpoint);
      } catch (e) {
        return;
      }

      ws.onopen = () => {
        const promptText = systemPromptInput.value.trim();
        const setupPayload = {
          setup: {
            model: chosenModel,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: voiceSelect.value }
                }
              }
            },
            ...(promptText ? { systemInstruction: { parts: [{ text: promptText }] } } : {}),
            tools: deviceTools
          }
        };

        ws.send(JSON.stringify(setupPayload));
        startMicCapture();

        connectBtn.classList.add("hidden");
        liveControls.classList.remove("hidden");
        setVisualState("listening", "Listening", "Go ahead");
      };

      ws.onmessage = async (evt) => {
        let raw = evt.data;
        if (raw instanceof Blob) raw = await raw.text();
        try {
          const res = JSON.parse(raw);
          handleServerTurn(res);
        } catch(e) {}
      };

      ws.onclose = () => cleanUpSession();
    });

    // Execute Autonomous Native Functions
    function executeLocalTool(name, args, id) {
      let result = "Action completed";
      try {
        if (!window.AndroidBridge) {
          result = "Android native bridge not ready.";
        } else if (name === "toggle_flashlight") {
          result = window.AndroidBridge.toggleFlashlight(!!args.state);
        } else if (name === "set_volume") {
          result = window.AndroidBridge.setVolume(args.level_percent || 50);
        } else if (name === "navigate_system") {
          result = window.AndroidBridge.navigateSystem(args.action || "home");
        } else if (name === "open_application") {
          result = window.AndroidBridge.openApp(args.app_name || "");
        } else if (name === "make_phone_call") {
          result = window.AndroidBridge.makePhoneCall(args.phone_number || "");
        } else if (name === "send_sms") {
          result = window.AndroidBridge.sendSms(args.phone_number || "", args.message || "");
        } else if (name === "read_screen_text") {
          result = window.AndroidBridge.readScreenText();
        } else if (name === "tap_element") {
          result = window.AndroidBridge.tapElement(args.label || "");
        } else if (name === "type_text") {
          result = window.AndroidBridge.typeText(args.text || "");
        }
      } catch (err) {
        result = "Error executing tool: " + err.message;
      }

      // Return tool response to Gemini Live Session
      if (ws && ws.readyState === WebSocket.OPEN) {
        const toolResponsePayload = {
          toolResponse: {
            functionResponses: [
              {
                id: id || "call_1",
                response: { output: { result: String(result) } }
              }
            ]
          }
        };
        ws.send(JSON.stringify(toolResponsePayload));
      }
    }

    toggleCameraBtn.addEventListener("click", async () => {
      if (!isCameraActive) {
        await startCameraVision();
      } else {
        stopCameraVision();
      }
    });

    async function startCameraVision() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraBox.classList.remove("hidden");
        toggleCameraBtn.classList.add("active");
        isCameraActive = true;
        startCameraStreaming();
      } catch(e) {
        toggleCameraBtn.classList.remove("active");
      }
    }

    function stopCameraVision() {
      if (cameraInterval) { clearInterval(cameraInterval); cameraInterval = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
      cameraBox.classList.add("hidden");
      toggleCameraBtn.classList.remove("active");
      isCameraActive = false;
    }

    flipCameraBtn.onclick = async () => {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      await startCameraVision();
    };

    function startCameraStreaming() {
      if (cameraInterval) clearInterval(cameraInterval);
      cameraInterval = setInterval(() => {
        if (!ws || ws.readyState !== WebSocket.OPEN || !cameraStream || !isCameraActive) return;
        if (cameraVideo.readyState < 2 || cameraVideo.videoWidth === 0) return;

        offscreenCtx.drawImage(cameraVideo, 0, 0, 320, 240);
        const dataUrl = offscreenCanvas.toDataURL("image/jpeg", 0.5);
        const parts = dataUrl.split(",");
        if (parts.length < 2) return;
        const base64Data = parts[1].trim();

        const frame = {
          realtimeInput: {
            video: {
              data: base64Data,
              mimeType: "image/jpeg"
            }
          }
        };
        ws.send(JSON.stringify(frame));
      }, 1500);
    }

    function startMicCapture() {
      const micCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = micCtx.createMediaStreamSource(micStream);

      micProcessor = micCtx.createScriptProcessor(2048, 1, 1);
      micProcessor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (echoGuardToggle.checked && isModelSpeaking) return;
        if (isMuted) return;

        const channel = e.inputBuffer.getChannelData(0);
        const downsampled = downsample(channel, micCtx.sampleRate, 16000);
        const pcm16 = toPCM16(downsampled);
        const b64 = bufferToBase64(pcm16);

        const frame = {
          realtimeInput: {
            audio: {
              data: b64,
              mimeType: "audio/pcm;rate=16000"
            }
          }
        };
        ws.send(JSON.stringify(frame));
      };

      source.connect(micProcessor);
      micProcessor.connect(micCtx.destination);
    }

    function handleServerTurn(msg) {
      // Check for Live Tool Calls
      if (msg.toolCall && msg.toolCall.functionCalls) {
        for (const call of msg.toolCall.functionCalls) {
          executeLocalTool(call.name, call.args, call.id);
        }
      }

      if (!msg.serverContent) return;

      if (msg.serverContent.interrupted) {
        stopAudioPlayback();
        isModelSpeaking = false;
        setVisualState("listening", "Listening", "Go ahead");
        return;
      }

      const parts = msg.serverContent.modelTurn?.parts;
      if (parts) {
        for (const part of parts) {
          if (part.functionCall) {
            executeLocalTool(part.functionCall.name, part.functionCall.args, part.functionCall.id || "1");
          }
          const b64 = part.inlineData?.data || part.data;
          if (b64) {
            if (echoCooldownTimer) {
              clearTimeout(echoCooldownTimer);
              echoCooldownTimer = null;
            }
            isModelSpeaking = true;
            playPCM(b64);
          }
        }
      }

      if (msg.serverContent.turnComplete) scheduleTurnEnd();
    }

    function playPCM(base64Audio) {
      setVisualState("speaking", "Speaking", "Gemini...");

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const binary = atob(base64Audio);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);

      const pcm16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(pcm16.length);
      for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768.0;

      const buffer = audioCtx.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);

      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (nextAudioTime < now) nextAudioTime = now + 0.05;
      src.start(nextAudioTime);
      nextAudioTime += buffer.duration;

      activeSources.push(src);
      src.onended = () => {
        const idx = activeSources.indexOf(src);
        if (idx !== -1) activeSources.splice(idx, 1);
        if (activeSources.length === 0) scheduleTurnEnd();
      };
    }

    function scheduleTurnEnd() {
      if (activeSources.length > 0) return;
      if (echoCooldownTimer) clearTimeout(echoCooldownTimer);
      echoCooldownTimer = setTimeout(() => {
        isModelSpeaking = false;
        echoCooldownTimer = null;
        if (ws && ws.readyState === WebSocket.OPEN) {
          setVisualState("listening", "Listening", "Go ahead");
        }
      }, 350);
    }

    function stopAudioPlayback() {
      activeSources.forEach(s => { try { s.stop(); } catch(e){} });
      activeSources = [];
      if (audioCtx) nextAudioTime = audioCtx.currentTime;
    }

    function downsample(buf, inRate, outRate) {
      if (inRate === outRate) return buf;
      const ratio = inRate / outRate;
      const len = Math.round(buf.length / ratio);
      const out = new Float32Array(len);
      let oR = 0, oB = 0;
      while (oR < len) {
        const next = Math.round((oR + 1) * ratio);
        let sum = 0, count = 0;
        for (let i = oB; i < next && i < buf.length; i++) { sum += buf[i]; count++; }
        out[oR] = count > 0 ? sum / count : 0;
        oR++;
        oB = next;
      }
      return out;
    }

    function toPCM16(input) {
      const out = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return out.buffer;
    }

    function bufferToBase64(buffer) {
      let bin = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i += 1024) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 1024, bytes.byteLength)));
      }
      return window.btoa(bin);
    }

    muteBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      muteBtn.classList.toggle("muted", isMuted);
    });

    disconnectBtn.addEventListener("click", () => {
      if (ws) ws.close();
      cleanUpSession();
      if (window.AndroidBridge && window.AndroidBridge.closeApp) {
        window.AndroidBridge.closeApp();
      }
    });

    function cleanUpSession() {
      stopAudioPlayback();
      stopCameraVision();
      if (echoCooldownTimer) clearTimeout(echoCooldownTimer);
      isModelSpeaking = false;

      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (micProcessor) {
        micProcessor.disconnect();
        micProcessor = null;
      }
      isMuted = false;
      muteBtn.classList.remove("muted");
      connectBtn.classList.remove("hidden");
      liveControls.classList.add("hidden");
      setVisualState("idle", "Voice", "Ready");
    }

    window.autoConnectOnWake = function() {
      if (autoConnectToggle.checked && apiKeyInput.value.trim() && (!ws || ws.readyState !== WebSocket.OPEN)) {
        connectBtn.click();
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      if (autoConnectToggle.checked && apiKeyInput.value.trim()) {
        setTimeout(() => connectBtn.click(), 250);
      }
    });
  </script>
</body>
</html>
