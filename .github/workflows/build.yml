      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Direct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.0 --yes || true
          git tag -d v3.0 || true
          gh release create v3.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "Voice v3.0 (Hybrid Native Architecture)" \
            --notes "Voice v3.0: Native OkHttp WebSocket, AudioRecord with Hardware AEC, AudioTrack playback, 65MB RAM footprint, 0ms direct tool calls, and Element ID Grounding." || true
