name: Build Gemini Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Native Android App
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html

          # Fallback icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          # Strings & Accessibility XML
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice</string>
              <string name="accessibility_desc">Double-press Volume Down to launch Voice assistant instantly over any screen or lock screen.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "Voice"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.live"
                  minSdk 24
                  targetSdk 34
                  versionCode 8
                  versionName "1.7"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # Manifest with Accessibility Service & System Alert
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:label="Voice"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleInstance"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeTriggerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # VolumeTriggerService.java: Listens for double-click Volume Down
          cat << 'EOF' > app/src/main/java/com/gemini/live/VolumeTriggerService.java
          package com.gemini.live;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.os.SystemClock;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;

          public class VolumeTriggerService extends AccessibilityService {
              private long lastVolumeDownTime = 0;
              private static final long DOUBLE_PRESS_INTERVAL = 450; // milliseconds

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  int action = event.getAction();

                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      if (action == KeyEvent.ACTION_DOWN) {
                          long now = SystemClock.uptimeMillis();
                          if (now - lastVolumeDownTime < DOUBLE_PRESS_INTERVAL) {
                              lastVolumeDownTime = 0;
                              launchAssistant();
                              return true; // Consume event to prevent second volume drop
                          } else {
                              lastVolumeDownTime = now;
                          }
                      }
                  }
                  return super.onKeyEvent(event);
              }

              private void launchAssistant() {
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK 
                                | Intent.FLAG_ACTIVITY_SINGLE_TOP 
                                | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(intent);
              }
          }
          EOF

          # MainActivity.java: Renders over lockscreen and provides Settings bridge
          cat << 'EOF' > app/src/main/java/com/gemini/live/MainActivity.java
          package com.gemini.live;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }

                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));

                  String[] perms = { Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA };
                  for (String p : perms) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(perms, 101);
                          break;
                      }
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.TRANSPARENT);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void minimize() {
                          runOnUiThread(() -> moveTaskToBack(true));
                      }
                      @JavascriptInterface
                      public void closeApp() {
                          runOnUiThread(() -> finish());
                      }
                      @JavascriptInterface
                      public void openAccessibilitySettings() {
                          runOnUiThread(() -> {
                              Intent intent = new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          });
                      }
                  }, "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (webView != null) webView.resumeTimers();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }

                  if (webView != null) {
                      webView.resumeTimers();
                      webView.evaluateJavascript("if (typeof autoConnectOnWake === 'function') autoConnectOnWake();", null);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      moveTaskToBack(true);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Direct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.7 --yes || true
          git tag -d v1.7 || true
          gh release create v1.7 app/build/outputs/apk/debug/app-debug.apk \
            --title "Voice v1.7" \
            --notes "Voice Assistant v1.7 - Hardware Volume Down Double-Click Trigger with Lockscreen Bypass" || true
