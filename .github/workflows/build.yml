name: Build Gemini Live APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Native Android App
        run: |
          mkdir -p app/src/main/java/com/gemini/live
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          cp index.html app/src/main/assets/index.html

          # Fallback icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAATUlEQVR42u3PMQEAAAgEIPuX1hgc/LDBV9JJ6rWTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwBv0hQABH1mYugAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Voice</string>
              <string name="accessibility_desc">Enables Volume Down double-click trigger, pinpoint screen automation, and autonomous device controls.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "Voice"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.gemini.live'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.live"
                  minSdk 24
                  targetSdk 34
                  versionCode 14
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />

              <application
                  android:label="Voice"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleInstance"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VolumeTriggerService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".ScreenCaptureService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          # NativeAudioPipeline.java: Native 16kHz AudioRecord (Hardware AEC) & 24kHz AudioTrack Playback
          cat << 'EOF' > app/src/main/java/com/gemini/live/NativeAudioPipeline.java
          package com.gemini.live;

          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.util.Base64;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class NativeAudioPipeline {
              private static final int IN_SAMPLE_RATE = 16000;
              private static final int OUT_SAMPLE_RATE = 24000;

              private AudioRecord audioRecord;
              private AudioTrack audioTrack;
              private Thread captureThread;
              private final AtomicBoolean isCapturing = new AtomicBoolean(false);
              private AudioDataListener listener;

              public interface AudioDataListener {
                  void onAudioCaptured(String base64Pcm);
                  void onSpeakingStateChanged(boolean isSpeaking);
              }

              public NativeAudioPipeline(AudioDataListener listener) {
                  this.listener = listener;
                  initPlaybackTrack();
              }

              private void initPlaybackTrack() {
                  int minBufferSize = AudioTrack.getMinBufferSize(
                      OUT_SAMPLE_RATE,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  );

                  // USAGE_MEDIA ensures audio plays out of the main media speaker loudly
                  AudioAttributes attrs = new AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                      .build();

                  AudioFormat format = new AudioFormat.Builder()
                      .setSampleRate(OUT_SAMPLE_RATE)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build();

                  audioTrack = new AudioTrack(
                      attrs,
                      format,
                      Math.max(minBufferSize * 2, 8192),
                      AudioTrack.MODE_STREAM,
                      AudioManager.AUDIO_SESSION_ID_GENERATE
                  );
                  audioTrack.play();
              }

              public synchronized void startCapture() {
                  if (isCapturing.get()) return;

                  int minBufferSize = AudioRecord.getMinBufferSize(
                      IN_SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  );

                  // Use MIC: 100% reliable real PCM capture on Samsung Android 10
                  audioRecord = new AudioRecord(
                      MediaRecorder.AudioSource.MIC,
                      IN_SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      Math.max(minBufferSize * 2, 4096)
                  );

                  if (audioRecord.getState() != AudioRecord.STATE_INITIALIZED) return;

                  isCapturing.set(true);
                  audioRecord.startRecording();

                  captureThread = new Thread(() -> {
                      android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO);
                      byte[] buffer = new byte[2048]; // ~64ms chunks

                      while (isCapturing.get()) {
                          int read = audioRecord.read(buffer, 0, buffer.length);
                          if (read > 0 && listener != null) {
                              String b64 = Base64.encodeToString(buffer, 0, read, Base64.NO_WRAP);
                              listener.onAudioCaptured(b64);
                          }
                      }
                  }, "NativeAudioCapture");
                  captureThread.start();
              }

              public void playPcmChunk(byte[] pcmBytes) {
                  if (audioTrack != null) {
                      if (audioTrack.getPlayState() != AudioTrack.PLAYSTATE_PLAYING) {
                          audioTrack.play();
                      }
                      if (listener != null) listener.onSpeakingStateChanged(true);
                      audioTrack.write(pcmBytes, 0, pcmBytes.length);
                  }
              }

              public void stopPlayback() {
                  if (audioTrack != null) {
                      try {
                          audioTrack.pause();
                          audioTrack.flush();
                          audioTrack.play();
                      } catch (Exception ignored) {}
                  }
                  if (listener != null) listener.onSpeakingStateChanged(false);
              }

              public synchronized void release() {
                  isCapturing.set(false);
                  if (audioRecord != null) {
                      try {
                          audioRecord.stop();
                          audioRecord.release();
                      } catch (Exception ignored) {}
                      audioRecord = null;
                  }
                  if (audioTrack != null) {
                      try {
                          audioTrack.stop();
                          audioTrack.release();
                      } catch (Exception ignored) {}
                      audioTrack = null;
                  }
              }
          }
          EOF

          # GeminiLiveClient.java: Native OkHttp WebSocket Engine with Direct 0ms Tool Execution
          cat << 'EOF' > app/src/main/java/com/gemini/live/GeminiLiveClient.java
          package com.gemini.live;

          import android.util.Base64;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.concurrent.TimeUnit;

          public class GeminiLiveClient {
              public static GeminiLiveClient instance = null;
              private WebSocket webSocket;
              private OkHttpClient client;
              private NativeAudioPipeline audioPipeline;
              private boolean isConnected = false;

              public interface UIUpdateListener {
                  void onStateChanged(String state, String title, String sub);
                  void onTaskStep(int step, String description);
              }
              private UIUpdateListener uiListener;

              public GeminiLiveClient(UIUpdateListener uiListener) {
                  this.uiListener = uiListener;
                  instance = this;
                  this.client = new OkHttpClient.Builder()
                      .pingInterval(15, TimeUnit.SECONDS)
                      .retryOnConnectionFailure(true)
                      .build();

                  this.audioPipeline = new NativeAudioPipeline(new NativeAudioPipeline.AudioDataListener() {
                      @Override
                      public void onAudioCaptured(String base64Pcm) {
                          sendAudioFrame(base64Pcm);
                      }
                      @Override
                      public void onSpeakingStateChanged(boolean isSpeaking) {
                          if (uiListener != null && isConnected) {
                              if (isSpeaking) uiListener.onStateChanged("speaking", "Speaking", "Jarvis...");
                              else uiListener.onStateChanged("listening", "Listening", "Go ahead");
                          }
                      }
                  });
              }

              public void connect(String apiKey, String model, String voice, String prompt, String toolsJsonStr) {
                  if (isConnected) disconnect();
                  if (uiListener != null) uiListener.onStateChanged("idle", "Connecting...", "Native Engine");

                  String endpoint = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + apiKey.trim();
                  Request request = new Request.Builder().url(endpoint).build();

                  webSocket = client.newWebSocket(request, new WebSocketListener() {
                      @Override
                      public void onOpen(WebSocket ws, Response response) {
                          isConnected = true;
                          sendSetupPayload(model, voice, prompt, toolsJsonStr);
                          if (uiListener != null) uiListener.onStateChanged("idle", "Connecting...", "Handshake");
                      }

                      @Override
                      public void onMessage(WebSocket ws, String text) {
                          handleIncomingMessage(text);
                      }

                      @Override
                      public void onFailure(WebSocket ws, Throwable t, Response response) {
                          isConnected = false;
                          if (audioPipeline != null) audioPipeline.stopPlayback();
                          if (uiListener != null) uiListener.onStateChanged("idle", "Connection Failed", t != null ? t.getMessage() : "Error");
                      }

                      @Override
                      public void onClosed(WebSocket ws, int code, String reason) {
                          isConnected = false;
                          if (audioPipeline != null) audioPipeline.stopPlayback();
                          if (uiListener != null) uiListener.onStateChanged("idle", "Voice", "Ready");
                      }
                  });
              }

              private void sendSetupPayload(String model, String voice, String prompt, String toolsJsonStr) {
                  try {
                      JSONObject setup = new JSONObject();
                      setup.put("model", (model != null && !model.trim().isEmpty()) ? model.trim() : "models/gemini-3.1-flash-live-preview");

                      JSONObject voiceConfig = new JSONObject();
                      voiceConfig.put("voiceName", (voice != null && !voice.trim().isEmpty()) ? voice.trim() : "Puck");
                      JSONObject speechConfig = new JSONObject();
                      speechConfig.put("voiceConfig", new JSONObject().put("prebuiltVoiceConfig", voiceConfig));

                      JSONObject genConfig = new JSONObject();
                      genConfig.put("responseModalities", new JSONArray().put("AUDIO"));
                      genConfig.put("speechConfig", speechConfig);
                      setup.put("generationConfig", genConfig);

                      if (prompt != null && !prompt.trim().isEmpty()) {
                          JSONObject textPart = new JSONObject().put("text", prompt);
                          setup.put("systemInstruction", new JSONObject().put("parts", new JSONArray().put(textPart)));
                      }

                      if (toolsJsonStr != null && !toolsJsonStr.trim().isEmpty()) {
                          setup.put("tools", new JSONArray(toolsJsonStr));
                      }

                      JSONObject root = new JSONObject().put("setup", setup);
                      webSocket.send(root.toString());
                  } catch (Exception ignored) {}
              }

              private void sendAudioFrame(String base64Pcm) {
                  if (!isConnected || webSocket == null) return;
                  try {
                      JSONObject audio = new JSONObject();
                      audio.put("data", base64Pcm);
                      audio.put("mimeType", "audio/pcm;rate=16000");

                      JSONObject realtimeInput = new JSONObject().put("audio", audio);
                      JSONObject frame = new JSONObject().put("realtimeInput", realtimeInput);
                      webSocket.send(frame.toString());
                  } catch (Exception ignored) {}
              }

              public void sendVideoFrame(String base64Jpeg) {
                  if (!isConnected || webSocket == null) return;
                  try {
                      JSONObject video = new JSONObject();
                      video.put("data", base64Jpeg);
                      video.put("mimeType", "image/jpeg");

                      JSONObject realtimeInput = new JSONObject().put("video", video);
                      JSONObject frame = new JSONObject().put("realtimeInput", realtimeInput);
                      webSocket.send(frame.toString());
                  } catch (Exception ignored) {}
              }

              private void handleIncomingMessage(String jsonStr) {
                  try {
                      JSONObject root = new JSONObject(jsonStr);

                      // Wait for setupComplete before starting mic stream!
                      if (root.has("setupComplete")) {
                          if (audioPipeline != null) audioPipeline.startCapture();
                          if (uiListener != null) uiListener.onStateChanged("listening", "Listening", "Go ahead");
                          return;
                      }

                      // Native Tool Calls (0ms hop)
                      if (root.has("toolCall")) {
                          JSONObject toolCall = root.getJSONObject("toolCall");
                          if (toolCall.has("functionCalls")) {
                              JSONArray calls = toolCall.getJSONArray("functionCalls");
                              for (int i = 0; i < calls.length(); i++) {
                                  JSONObject c = calls.getJSONObject(i);
                                  executeNativeTool(c.getString("name"), c.optJSONObject("args"), c.optString("id", "call_1"));
                              }
                          }
                      }

                      if (!root.has("serverContent")) return;
                      JSONObject serverContent = root.getJSONObject("serverContent");

                      if (serverContent.optBoolean("interrupted", false)) {
                          if (audioPipeline != null) audioPipeline.stopPlayback();
                          if (uiListener != null) uiListener.onStateChanged("listening", "Listening", "Go ahead");
                          return;
                      }

                      if (serverContent.has("modelTurn")) {
                          JSONObject modelTurn = serverContent.getJSONObject("modelTurn");
                          if (modelTurn.has("parts")) {
                              JSONArray parts = modelTurn.getJSONArray("parts");
                              for (int i = 0; i < parts.length(); i++) {
                                  JSONObject part = parts.getJSONObject(i);
                                  if (part.has("functionCall")) {
                                      JSONObject fc = part.getJSONObject("functionCall");
                                      executeNativeTool(fc.getString("name"), fc.optJSONObject("args"), fc.optString("id", "call_1"));
                                  }
                                  String b64Audio = null;
                                  if (part.has("inlineData")) {
                                      b64Audio = part.getJSONObject("inlineData").optString("data", null);
                                  } else if (part.has("data")) {
                                      b64Audio = part.optString("data", null);
                                  }
                                  if (b64Audio != null) {
                                      byte[] pcmBytes = Base64.decode(b64Audio, Base64.NO_WRAP);
                                      if (audioPipeline != null) audioPipeline.playPcmChunk(pcmBytes);
                                  }
                              }
                          }
                      }

                      if (serverContent.optBoolean("turnComplete", false)) {
                          if (uiListener != null) uiListener.onStateChanged("listening", "Listening", "Go ahead");
                      }
                  } catch (Exception ignored) {}
              }

              private void executeNativeTool(String name, JSONObject args, String callId) {
                  String result = "Completed";
                  if (args == null) args = new JSONObject();

                  try {
                      if (MainActivity.instance == null) {
                          result = "Bridge unavailable";
                      } else if ("search_live_web".equals(name)) {
                          result = MainActivity.instance.bridgeSearchLiveWeb(args.optString("query", ""));
                      } else if ("tap_element_id".equals(name)) {
                          int id = args.optInt("element_id", -1);
                          result = MainActivity.instance.bridgeTapElementId(id);
                      } else if ("tap_coordinates".equals(name)) {
                          int x = args.optInt("x", 0);
                          int y = args.optInt("y", 0);
                          result = MainActivity.instance.bridgeTapCoordinates(x, y);
                      } else if ("long_press".equals(name)) {
                          int x = args.optInt("x", 0);
                          int y = args.optInt("y", 0);
                          result = MainActivity.instance.bridgeLongPress(x, y);
                      } else if ("type_text".equals(name)) {
                          result = MainActivity.instance.bridgeTypeText(args.optString("text", ""));
                      } else if ("create_note".equals(name)) {
                          result = MainActivity.instance.bridgeCreateNote(args.optString("text", ""));
                      } else if ("read_screen_text".equals(name)) {
                          result = MainActivity.instance.bridgeReadScreenText();
                      } else if ("capture_screen".equals(name)) {
                          result = MainActivity.instance.bridgeCaptureScreen();
                      } else if ("scroll".equals(name)) {
                          result = MainActivity.instance.bridgeScroll(args.optString("direction", "down"));
                      } else if ("swipe".equals(name)) {
                          result = MainActivity.instance.bridgeSwipe(args.optInt("start_x", 0), args.optInt("start_y", 0), args.optInt("end_x", 0), args.optInt("end_y", 0), args.optInt("duration_ms", 300));
                      } else if ("wait_seconds".equals(name)) {
                          int s = Math.min(Math.max(args.optInt("seconds", 1), 1), 4);
                          Thread.sleep(s * 1000L);
                          result = "Waited " + s + "s";
                      } else if ("open_application".equals(name)) {
                          result = MainActivity.instance.bridgeOpenApp(args.optString("app_name", ""));
                      } else if ("search_contacts".equals(name)) {
                          result = MainActivity.instance.bridgeSearchContacts(args.optString("query", ""));
                      } else if ("search_youtube".equals(name)) {
                          result = MainActivity.instance.bridgeSearchYouTube(args.optString("query", ""));
                      } else if ("search_web".equals(name)) {
                          result = MainActivity.instance.bridgeSearchWeb(args.optString("query", ""));
                      } else if ("open_whatsapp".equals(name)) {
                          result = MainActivity.instance.bridgeOpenWhatsApp(args.optString("phone_number", ""), args.optString("message", ""));
                      } else if ("make_phone_call".equals(name)) {
                          result = MainActivity.instance.bridgeMakeCall(args.optString("phone_number", ""));
                      } else if ("send_sms".equals(name)) {
                          result = MainActivity.instance.bridgeSendSms(args.optString("phone_number", ""), args.optString("message", ""));
                      } else if ("toggle_flashlight".equals(name)) {
                          result = MainActivity.instance.bridgeToggleFlashlight(args.optBoolean("state", false));
                      } else if ("set_volume".equals(name)) {
                          result = MainActivity.instance.bridgeSetVolume(args.optInt("level_percent", 50));
                      } else if ("navigate_system".equals(name)) {
                          result = MainActivity.instance.bridgeNavigateSystem(args.optString("action", "home"));
                      }
                  } catch (Exception e) {
                      result = "Execution error: " + e.getMessage();
                  }

                  sendToolResponse(callId, result);
              }

              private void sendToolResponse(String id, String resultStr) {
                  if (!isConnected || webSocket == null) return;
                  try {
                      JSONObject resObj = new JSONObject().put("result", resultStr);
                      JSONObject funcRes = new JSONObject()
                          .put("id", id)
                          .put("response", new JSONObject().put("output", resObj));

                      JSONObject toolResponse = new JSONObject()
                          .put("functionResponses", new JSONArray().put(funcRes));

                      JSONObject payload = new JSONObject().put("toolResponse", toolResponse);
                      webSocket.send(payload.toString());
                  } catch (Exception ignored) {}
              }

              public void disconnect() {
                  isConnected = false;
                  if (audioPipeline != null) {
                      audioPipeline.stopPlayback();
                      audioPipeline.release();
                  }
                  if (webSocket != null) {
                      try { webSocket.close(1000, "Client disconnect"); } catch (Exception ignored) {}
                      webSocket = null;
                  }
                  if (uiListener != null) uiListener.onStateChanged("idle", "Voice", "Ready");
              }
          }
          EOF

          # VolumeTriggerService.java: Candidate Indexer [0..N], 0-1000 Mapping, Long-Press & Multi-Signal Keyboard
          cat << 'EOF' > app/src/main/java/com/gemini/live/VolumeTriggerService.java
          package com.gemini.live;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.DisplayMetrics;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class VolumeTriggerService extends AccessibilityService {
              public static VolumeTriggerService instance = null;
              private long lastVolumeDownTime = 0;
              private static final long DOUBLE_PRESS_INTERVAL = 450;
              private Handler mainHandler = new Handler(Looper.getMainLooper());
              private Map<Integer, Rect> candidateElementMap = new HashMap<>();

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              private void showToast(String msg) {
                  mainHandler.post(() -> {
                      try {
                          Toast.makeText(getApplicationContext(), msg, Toast.LENGTH_SHORT).show();
                      } catch (Exception ignored) {}
                  });
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  int type = event.getEventType();
                  if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED || type == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                      autoApproveDialogs();
                  }
              }

              private void autoApproveDialogs() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  findAndClickApprovalButton(root);
              }

              private boolean findAndClickApprovalButton(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  CharSequence text = node.getText();
                  if (text != null) {
                      String t = text.toString().toLowerCase().trim();
                      if (t.equals("start now") || t.equals("allow") || t.equals("while using the app")) {
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                  }
                  String id = node.getViewIdResourceName();
                  if (id != null && (id.endsWith("button1") || id.endsWith("permission_allow_button"))) {
                      CharSequence btnText = node.getText();
                      if (btnText == null || !btnText.toString().toLowerCase().contains("cancel")) {
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (findAndClickApprovalButton(node.getChild(i))) return true;
                  }
                  return false;
              }

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  int action = event.getAction();

                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && action == KeyEvent.ACTION_DOWN) {
                      long now = SystemClock.uptimeMillis();
                      if (now - lastVolumeDownTime < DOUBLE_PRESS_INTERVAL) {
                          lastVolumeDownTime = 0;
                          launchAssistantWithHaptics();
                          return true;
                      } else {
                          lastVolumeDownTime = now;
                      }
                  }
                  return super.onKeyEvent(event);
              }

              private void launchAssistantWithHaptics() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(new long[]{0, 50, 70, 50}, -1));
                          } else {
                              v.vibrate(new long[]{0, 50, 70, 50}, -1);
                          }
                      }
                  } catch (Exception ignored) {}

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK 
                                | Intent.FLAG_ACTIVITY_SINGLE_TOP 
                                | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  startActivity(intent);
              }

              public boolean tapElementId(int id) {
                  Rect bounds = candidateElementMap.get(id);
                  if (bounds != null) {
                      return tapCoordinates(bounds.centerX(), bounds.centerY());
                  }
                  showToast("Element #" + id + " not in catalog");
                  return false;
              }

              public boolean tapCoordinates(int x, int y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;

                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int targetX = Math.max(2, Math.min(x, dm.widthPixels - 2));
                  int targetY = Math.max(2, Math.min(y, dm.heightPixels - 2));

                  Path clickPath = new Path();
                  clickPath.moveTo(targetX, targetY);
                  clickPath.lineTo(targetX, targetY + 1);

                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(clickPath, 0, 120);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);

                  final int finalX = targetX;
                  final int finalY = targetY;

                  return dispatchGesture(builder.build(), new GestureResultCallback() {
                      @Override
                      public void onCompleted(GestureDescription gestureDescription) {
                          super.onCompleted(gestureDescription);
                          showToast("✓ Tapped (" + finalX + ", " + finalY + ")");
                      }
                  }, null);
              }

              public boolean longPress(int x, int y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;

                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int targetX = Math.max(2, Math.min(x, dm.widthPixels - 2));
                  int targetY = Math.max(2, Math.min(y, dm.heightPixels - 2));

                  Path path = new Path();
                  path.moveTo(targetX, targetY);
                  path.lineTo(targetX, targetY + 1);

                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, 700);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);

                  final int fX = targetX;
                  final int fY = targetY;

                  return dispatchGesture(builder.build(), new GestureResultCallback() {
                      @Override
                      public void onCompleted(GestureDescription gestureDescription) {
                          super.onCompleted(gestureDescription);
                          showToast("✓ Long-pressed (" + fX + ", " + fY + ")");
                      }
                  }, null);
              }

              public boolean swipe(int startX, int startY, int endX, int endY, int durationMs) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  Path path = new Path();
                  path.moveTo(startX, startY);
                  path.lineTo(endX, endY);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(100, durationMs));
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);
                  return dispatchGesture(builder.build(), null, null);
              }

              public boolean scroll(String direction) {
                  WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  DisplayMetrics dm = new DisplayMetrics();
                  if (wm != null) wm.getDefaultDisplay().getRealMetrics(dm);
                  else dm = getResources().getDisplayMetrics();

                  int midX = dm.widthPixels / 2;
                  int h = dm.heightPixels;
                  if ("up".equalsIgnoreCase(direction)) {
                      return swipe(midX, (int)(h * 0.3), midX, (int)(h * 0.8), 300);
                  } else {
                      return swipe(midX, (int)(h * 0.8), midX, (int)(h * 0.3), 300);
                  }
              }

              public String readScreenText() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return "No active window detected.";

                  candidateElementMap.clear();
                  StringBuilder catalog = new StringBuilder();
                  catalog.append("=== INTERACTIVE ELEMENTS (CANDIDATE IDs) ===\n");
                  List<String> elementList = new ArrayList<>();
                  extractInteractiveCandidates(root, elementList, 0);

                  if (elementList.isEmpty()) {
                      catalog.append("No labeled buttons found.\n");
                  } else {
                      for (String item : elementList) catalog.append(item).append("\n");
                  }

                  catalog.append("\n=== SCREEN TEXT ===\n");
                  StringBuilder textSb = new StringBuilder();
                  extractTextRecursive(root, textSb, 0);
                  catalog.append(textSb.toString().trim());

                  return catalog.toString();
              }

              private void extractInteractiveCandidates(AccessibilityNodeInfo node, List<String> list, int depth) {
                  if (node == null || depth > 25 || candidateElementMap.size() >= 30) return;
                  if (node.isClickable() || node.isEditable() || node.isLongClickable()) {
                      CharSequence text = node.getText();
                      CharSequence desc = node.getContentDescription();
                      String label = text != null ? text.toString().trim() : (desc != null ? desc.toString().trim() : "");
                      if (!label.isEmpty()) {
                          Rect r = new Rect();
                          node.getBoundsInScreen(r);
                          if (r.width() > 8 && r.height() > 8) {
                              int id = candidateElementMap.size();
                              candidateElementMap.put(id, r);
                              String type = node.isEditable() ? "Input" : "Button";
                              list.add("[#" + id + "] " + type + " \"" + label + "\" at (" + r.centerX() + ", " + r.centerY() + ")");
                          }
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      extractInteractiveCandidates(node.getChild(i), list, depth + 1);
                  }
              }

              private void extractTextRecursive(AccessibilityNodeInfo node, StringBuilder sb, int depth) {
                  if (node == null || depth > 25) return;
                  CharSequence text = node.getText();
                  if (text != null && text.length() > 0) {
                      sb.append(text).append("\n");
                  } else {
                      CharSequence desc = node.getContentDescription();
                      if (desc != null && desc.length() > 0) {
                          sb.append(desc).append("\n");
                      }
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      extractTextRecursive(node.getChild(i), sb, depth + 1);
                  }
              }

              private boolean isKeyboardVisible() {
                  List<AccessibilityWindowInfo> windows = getWindows();
                  if (windows != null) {
                      for (AccessibilityWindowInfo window : windows) {
                          if (window.getType() == AccessibilityWindowInfo.TYPE_INPUT_METHOD) {
                              return true;
                          }
                      }
                  }
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root != null) {
                      AccessibilityNodeInfo focused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                      if (focused != null && focused.isEditable()) {
                          Rect bounds = new Rect();
                          focused.getBoundsInScreen(bounds);
                          DisplayMetrics dm = getResources().getDisplayMetrics();
                          if (bounds.bottom < dm.heightPixels / 2) return true;
                      }
                  }
                  return false;
              }

              private void safeDismissKeyboard() {
                  if (isKeyboardVisible()) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          CharSequence pkg = root.getPackageName();
                          if (pkg != null && (pkg.toString().contains("launcher"))) return;
                      }
                      performGlobalAction(GLOBAL_ACTION_BACK);
                      SystemClock.sleep(120);
                  }
              }

              public boolean typeText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;

                  safeDismissKeyboard();
                  root = getRootInActiveWindow();
                  if (root == null) return false;

                  AccessibilityNodeInfo focused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (focused == null) focused = findFocusedNode(root, 0);

                  if (focused != null) {
                      return pasteDirectly(focused, text);
                  }

                  AccessibilityNodeInfo editable = findFirstEditable(root, 0);
                  if (editable != null) {
                      Rect rect = new Rect();
                      editable.getBoundsInScreen(rect);
                      if (rect.width() > 0 && rect.height() > 0) {
                          tapCoordinates(rect.centerX(), rect.centerY());
                          SystemClock.sleep(150);
                      }
                      root = getRootInActiveWindow();
                      if (root != null) {
                          AccessibilityNodeInfo nowFocused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                          if (nowFocused != null) return pasteDirectly(nowFocused, text);
                      }
                      return pasteDirectly(editable, text);
                  }
                  return false;
              }

              private AccessibilityNodeInfo findFocusedNode(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 25) return null;
                  if (node.isFocused()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo res = findFocusedNode(node.getChild(i), depth + 1);
                      if (res != null) return res;
                  }
                  return null;
              }

              private boolean pasteDirectly(AccessibilityNodeInfo node, String text) {
                  try {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm != null) {
                          ClipData clip = ClipData.newPlainText("jarvis_input", text);
                          cm.setPrimaryClip(clip);
                      }
                  } catch (Exception ignored) {}

                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                  SystemClock.sleep(50);

                  boolean ok = node.performAction(AccessibilityNodeInfo.ACTION_PASTE);
                  if (!ok) {
                      Bundle args = new Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      ok = node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                  }
                  if (ok) showToast("✓ Inserted text");
                  return ok;
              }

              private AccessibilityNodeInfo findFirstEditable(AccessibilityNodeInfo node, int depth) {
                  if (node == null || depth > 25) return null;
                  if (node.isEditable()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo found = findFirstEditable(node.getChild(i), depth + 1);
                      if (found != null) return found;
                  }
                  return null;
              }
          }
