              public String bridgeOpenApp(String appName) {
                  PackageManager pm = getPackageManager();
                  List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                  for (ApplicationInfo app : apps) {
                      String label = pm.getApplicationLabel(app).toString().toLowerCase();
                      if (label.contains(appName.toLowerCase().trim())) {
                          Intent launchIntent = pm.getLaunchIntentForPackage(app.packageName);
                          if (launchIntent != null) {
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launchIntent);
                              return "Opened " + label;
                          }
                      }
                  }
                  return "Could not find app " + appName;
              }

              public String bridgeSearchContacts(String query) {
                  try {
                      ContentResolver cr = getContentResolver();
                      Uri uri = ContactsContract.CommonDataKinds.Phone.CONTENT_URI;
                      String selection = ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?";
                      String[] selectionArgs = new String[]{"%" + query.trim() + "%"};
                      Cursor cursor = cr.query(uri, new String[]{
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      }, selection, selectionArgs, null);

                      if (cursor != null) {
                          JSONArray results = new JSONArray();
                          while (cursor.moveToNext()) {
                              JSONObject obj = new JSONObject();
                              obj.put("name", cursor.getString(0));
                              obj.put("number", cursor.getString(1));
                              results.put(obj);
                              if (results.length() >= 5) break;
                          }
                          cursor.close();
                          if (results.length() > 0) return results.toString();
                      }
                  } catch (Exception e) { return "Contact error: " + e.getMessage(); }
                  return "No contacts found matching: " + query;
              }

